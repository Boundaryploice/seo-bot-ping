# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → подключи репозиторий с этим файлом.
services:
  - type: web
    name: seo-bot-ping
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-ping.txt
    startCommand: python ping_server_main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: PING_TELEGRAM_CHAT_ID
        sync: false
      - key: PING_PUBLIC_URL
        sync: false
      - key: PING_SECRET
        generateValue: true
      - key: PING_OWN_LABELS
        sync: false
      - key: PING_OWN_PROXY_HOSTS
        sync: false
      - key: PING_COOLDOWN_MINUTES
        value: "60"
      - key: PING_SUPPRESS_AFTER_UPDATE_MIN
        value: "15"
      - key: EXTRA_BUILD_STEP
        sync: false
      - key: PING_INSTALL_URL
        sync: false
